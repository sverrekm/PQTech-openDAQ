# Overstyring for FAST IP (static). Legg denne oppaa base-compose:
#   docker compose -f docker-compose.yml -f docker-compose.static.yml up -d
# start.sh gjer dette automatisk naar IP_MODE=static i .env.
#
# Base-compose koeyrer DHCP (null-IPAM + dhclient). Denne fila gir i staden
# containeren ein pinna macvlan-adresse (CONTAINER_IP) paa eit kjent
# subnett/gateway — same aatferd som foer overhalinga. Set desse i .env:
#   IP_MODE=static
#   CONTAINER_IP=192.168.1.161
#   NET_SUBNET=192.168.1.0/24
#   NET_GATEWAY=192.168.1.1
# (pqtech-config.sh «Nettverk» skriv dei; NET_SUBNET/NET_GATEWAY kan lesast av
#  verten med «Les subnett + gateway av nettet».)
services:
  opendaq:
    networks:
      daqnet:
        ipv4_address: ${CONTAINER_IP:-192.168.1.161}
    environment:
      # Fast IP => annonser han eksplisitt for OPC-UA/DewesoftX.
      - OPENDAQ_IP=${CONTAINER_IP:-192.168.1.161}
      - IP_MODE=static

networks:
  daqnet:
    ipam:
      # Overstyr null-IPAM fraa base med ekte adresse-styring.
      driver: default
      config:
        - subnet: ${NET_SUBNET:-192.168.1.0/24}
          gateway: ${NET_GATEWAY:-192.168.1.1}
          ip_range: ${CONTAINER_IP:-192.168.1.161}/32
