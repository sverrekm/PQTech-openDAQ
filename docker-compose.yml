services:
  opendaq-sirius:
    build:
      context: .
      args:
        PARALLELLE_JOBBER: 2
    image: opendaq-sirius:latest
    container_name: opendaq-sirius
    restart: unless-stopped

    # USB-tilgang til SIRIUS
    privileged: true

    # macvlan-nettverk: eigen IP paa LAN (DewesoftX SSH-ar hit)
    networks:
      daqnet:
        ipv4_address: ${CONTAINER_IP:-192.168.1.161}

    # PID host-namespace: nsenter -t 1 treng tilgang til hostens PID 1
    pid: host

    volumes:
      # USB-enheter
      - /dev/bus/usb:/dev/bus/usb
      # sysfs - usbip trenger tilgang for aa finne enheter og binde
      - /sys:/sys
      # debugfs - usbmon for passiv USB-trafikkfangst
      - /sys/kernel/debug:/sys/kernel/debug
      # Maalingar (persistente)
      - ./maalinger:/data/maalinger
      # Konfigurasjon (lagres mellom omstarter)
      - ./konfig:/data/konfig

    environment:
      # Tilkoblingsstreng (tom = auto-oppdagelse av SIRIUS USB)
      # Eksempler:
      #   daq.opcua://192.168.1.100   (OPC-UA)
      #   daq.ns://192.168.1.100      (native streaming)
      #   daqref://device0             (simulator)
      - TILKOBLING=
      # Sett til "true" for aa bruke simulator uten hardware
      - BRUK_SIMULATOR=false
      # Web-grensesnitt port
      - WEB_PORT=8080
      # Autonom maaling
      - MAALE_INTERVALL=60
      - MAALE_VARIGHET=5
      - SAMPLE_RATE=1000
      - MAALE_PREFIKS=maaling
      # Sett til "true" for aa bruke direkte SIRIUS USB-driver
      # (uten openDAQ SDK - bruker reverse-engineered protokoll)
      - NATIVE_SIRIUS=true
      # Deaktiver RefDevice intern datagenering (Python injiserer ekte data)
      - OPENDAQ_DISABLE_ACQ=1
      # Serienummer for SIRIUS-eining (maa matche USB-eininga sitt serienummer)
      - OPENDAQ_SERIAL=D019274CF6
      # MAC-adresse (tom = auto-detect fraa nettverksgrensesnitt)
      #- OPENDAQ_MAC=
      # OPC-UA annonsert IP — sett til container-IP (macvlan)
      - OPENDAQ_IP=${CONTAINER_IP:-192.168.1.161}

    deploy:
      resources:
        limits:
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  daqnet:
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1
          ip_range: ${CONTAINER_IP:-192.168.1.161}/32
