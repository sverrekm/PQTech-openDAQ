services:
  opendaq-sirius:
    build:
      context: .
      args:
        PARALLELLE_JOBBER: 2
    image: opendaq-sirius:latest
    container_name: opendaq-sirius
    restart: unless-stopped

    # USB-tilgang til SIRIUS
    privileged: true

    # Host-nettverk for openDAQ-servere og web UI
    network_mode: host

    volumes:
      # USB-enheter
      - /dev/bus/usb:/dev/bus/usb
      # sysfs - usbip trenger tilgang for aa finne enheter og binde
      - /sys:/sys
      # debugfs - usbmon for passiv USB-trafikkfangst
      - /sys/kernel/debug:/sys/kernel/debug
      # Host modules-load.d - gjor kernel-moduler permanente ved reboot
      - /etc/modules-load.d:/host-modules-load
      # Host udev-regler - installer Dewesoft USB-regler paa hosten
      - /etc/udev/rules.d:/host-udev-rules
      # Maalinger (persistente)
      - ./maalinger:/data/maalinger
      # Konfigurasjon (lagres mellom omstarter)
      - ./konfig:/data/konfig

    environment:
      # Tilkoblingsstreng (tom = auto-oppdagelse av SIRIUS USB)
      # Eksempler:
      #   daq.opcua://192.168.1.100   (OPC-UA)
      #   daq.ns://192.168.1.100      (native streaming)
      #   daqref://device0             (simulator)
      - TILKOBLING=
      # Sett til "true" for aa bruke simulator uten hardware
      - BRUK_SIMULATOR=false
      # Web-grensesnitt port
      - WEB_PORT=8080
      # Autonom maaling
      - MAALE_INTERVALL=60
      - MAALE_VARIGHET=5
      - SAMPLE_RATE=1000
      - MAALE_PREFIKS=maaling
      # Sett til "true" for aa bruke direkte SIRIUS USB-driver
      # (uten openDAQ SDK - bruker reverse-engineered protokoll)
      - NATIVE_SIRIUS=true
      # OPC-UA annonsert IP (tom = auto-detect foerste interface)
      # Sett til spesifikk IP viss Pi har fleire nettverk
      #- OPENDAQ_IP=192.168.1.160

    deploy:
      resources:
        limits:
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
