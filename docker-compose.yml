services:
  opendaq:
    build:
      context: .
      args:
        PARALLELLE_JOBBER: 4
    image: pqtech-opendaq:latest
    container_name: pqtech-opendaq
    restart: unless-stopped

    # USB-tilgang til Dewesoft-instrument
    privileged: true

    # macvlan-nettverk: eigen IP paa LAN (DewesoftX treng SSH til containeren)
    networks:
      daqnet:
        ipv4_address: ${CONTAINER_IP:-192.168.1.161}
      # Veg ut via verten. macvlan-grensesnittet over kan ikkje snakke med
      # sin eigen vert, og ser difor ingenting av dei andre netta verten er
      # paa - t.d. eit instrument-wifi eller eit isolert maalesegment. Dette
      # bridge-nettet gir containeren ein rutbar veg dit; instrument_ruter.py
      # legg inn rutene. Endrar ikkje default-ruta, som framleis gaar paa
      # macvlan.
      instrumentnett: {}

    # PID host-namespace: nsenter -t 1 treng tilgang til hostens PID 1
    pid: host

    # Tailscale VPN krev tun-device og nettverks-capabilities
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW

    volumes:
      # USB-enheter
      - /dev/bus/usb:/dev/bus/usb
      # sysfs - usbip trenger tilgang for aa finne enheter og binde
      - /sys:/sys
      # debugfs - usbmon for passiv USB-trafikkfangst
      - /sys/kernel/debug:/sys/kernel/debug
      # Maalingar + databasar (persistente). Host-katalog styrt av DATA_DIR
      # i .env (sett via pqtech-config.sh). Standard: ./maalinger
      - ${DATA_DIR:-./maalinger}:/data/maalinger
      # NAS for rå-fil-arkiv (CIFS/SMB). Host mountar NAS og set NAS_DIR i
      # .env til mount-punktet (t.d. /mnt/nas/pqtech). Standard ./nas (lokal)
      # når ingen NAS. Sjå raa_fil_skrivar + pqtech-config.sh.
      - ${NAS_DIR:-./nas}:/data/nas
      # Konfigurasjon (lagres mellom omstarter)
      - ./konfig:/data/konfig
      # Tailscale VPN state (persistent)
      - ./tailscale:/data/tailscale

    environment:
      # Driftsmodus: sett via GUI (lagra i /data/konfig/modus.json).
      # Kan overstyrast med OPENDAQ_MODUS=hub her for bakoverkompatibilitet.
      #- OPENDAQ_MODUS=hub

      # Tilkoblingsstreng (tom = auto-oppdagelse av Dewesoft USB-instrument)
      # Eksempler:
      #   daq.opcua://192.168.1.100   (OPC-UA)
      #   daq.ns://192.168.1.100      (native streaming)
      #   daqref://device0             (simulator)
      - TILKOBLING=
      # Sett til "true" for aa bruke simulator uten hardware
      - BRUK_SIMULATOR=false
      # Web-grensesnitt port
      - WEB_PORT=8080
      # Autonom maaling
      - MAALE_INTERVALL=60
      - MAALE_VARIGHET=5
      - SAMPLE_RATE=20000
      - MAALE_PREFIKS=maaling
      # Sett til "true" for aa bruke direkte SIRIUS USB-driver
      # (reverse-engineered protokoll — kun for SIRIUS-instrument)
      - NATIVE_SIRIUS=true
      # Serienummer (tom = auto-detektert fraa instrumentet)
      - OPENDAQ_SERIAL=
      # Modellnamn som visest i DewesoftX (tom = "PQTech-openDAQ")
      - OPENDAQ_MODEL=PQTech-openDAQ
      # MAC-adresse (tom = auto-detect fraa nettverksgrensesnitt)
      #- OPENDAQ_MAC=
      # OPC-UA annonsert IP — sett til container-IP (macvlan)
      - OPENDAQ_IP=${CONTAINER_IP:-192.168.1.161}
      # Device-indeks for daqref://device{N} — gir unik localId per node
      # (unngår "Device with the same local ID already exists" når hub
      # koblar til fleire nodar samtidig). Sett 0, 1, 2, ... per node.
      - OPENDAQ_DEVICE_IDX=${OPENDAQ_DEVICE_IDX:-0}
      # Push-token: nodar som POST-ar til /api/ingest må bruke dette tokenet
      # i Authorization: Bearer-header. Tom = endepunktet returnerer 503.
      # Kan òg setjast i /data/konfig/push.json (ingest_token-feltet).
      - INGEST_TOKEN=${INGEST_TOKEN:-}

    deploy:
      resources:
        limits:
          memory: 1G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  instrumentnett:
    # Med vilje UTAN pinna subnett: Docker finn sjoelv eit ledig omraade.
    # Ei pinning her kolliderer med andre docker-prosjekt paa verten, og da
    # nektar Docker aa lage nettet - etter at containeren er fjerna.
    driver: bridge

  daqnet:
    driver: macvlan
    driver_opts:
      parent: ${NET_PARENT:-eth0}
    ipam:
      config:
        # Subnett og gateway MAA matche nettet som parent-grensesnittet
        # faktisk staar paa. Dei var hardkoda til 192.168.1.0/24, som er
        # grunnen til at alle anlegg enda paa same subnett - og til at to
        # kundenett kolliderte. pqtech-config.sh les dei av verten.
        - subnet: ${NET_SUBNET:-192.168.1.0/24}
          gateway: ${NET_GATEWAY:-192.168.1.1}
          ip_range: ${CONTAINER_IP:-192.168.1.161}/32
