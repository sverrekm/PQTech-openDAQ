services:
  usbip-sirius:
    build: .
    image: usbip-sirius:latest
    container_name: usbip-sirius
    restart: unless-stopped

    # Krever privilegert modus for kjernemoduler og USB-tilgang
    privileged: true

    # Host-nettverk slik at Windows-PC kan naa usbipd (port 3240)
    network_mode: host

    volumes:
      # Tilgang til USB-enheter
      - /dev/bus/usb:/dev/bus/usb
      # Kjernemoduler for usbip
      - /lib/modules:/lib/modules:ro

    environment:
      # Bus-ID for SIRIUS (valgfritt - auto-oppdagelse brukes ellers)
      # Finn med: lsusb eller usbip list -l
      - SIRIUS_BUSID=
      # Sekunder mellom statussjekker
      - POLL_INTERVALL=10
      # Auto-bind SIRIUS naar den kobles til
      - AUTO_BIND=true

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
