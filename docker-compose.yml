services:
  opendaq:
    build:
      context: .
      args:
        PARALLELLE_JOBBER: 4
    image: pqtech-opendaq:latest
    container_name: pqtech-opendaq
    restart: unless-stopped

    # Host-nettverk: container deler vertens nettverkstack.
    # Portane (8080, 4840, 7420) er tilgjengelege på alle vertens IP-ar
    # inkludert LAN og Tailscale — fungerer for baade node og hub.
    network_mode: host

    # USB-tilgang til Dewesoft-instrument
    privileged: true

    # PID host-namespace: nsenter -t 1 treng tilgang til hostens PID 1
    pid: host

    # Tailscale VPN krev tun-device og nettverks-capabilities
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW

    volumes:
      # USB-enheter
      - /dev/bus/usb:/dev/bus/usb
      # sysfs - usbip trenger tilgang for aa finne enheter og binde
      - /sys:/sys
      # debugfs - usbmon for passiv USB-trafikkfangst
      - /sys/kernel/debug:/sys/kernel/debug
      # Maalingar (persistente)
      - ./maalinger:/data/maalinger
      # Konfigurasjon (lagres mellom omstarter)
      - ./konfig:/data/konfig
      # Tailscale VPN state (persistent)
      - ./tailscale:/data/tailscale

    environment:
      # Driftsmodus: sett via GUI (lagra i /data/konfig/modus.json).
      # Kan overstyrast med OPENDAQ_MODUS=hub her for bakoverkompatibilitet.
      #- OPENDAQ_MODUS=hub

      # Tilkoblingsstreng (tom = auto-oppdagelse av Dewesoft USB-instrument)
      # Eksempler:
      #   daq.opcua://192.168.1.100   (OPC-UA)
      #   daq.ns://192.168.1.100      (native streaming)
      #   daqref://device0             (simulator)
      - TILKOBLING=
      # Sett til "true" for aa bruke simulator uten hardware
      - BRUK_SIMULATOR=false
      # Web-grensesnitt port
      - WEB_PORT=8080
      # Autonom maaling
      - MAALE_INTERVALL=60
      - MAALE_VARIGHET=5
      - SAMPLE_RATE=20000
      - MAALE_PREFIKS=maaling
      # Sett til "true" for aa bruke direkte SIRIUS USB-driver
      # (reverse-engineered protokoll — kun for SIRIUS-instrument)
      - NATIVE_SIRIUS=true
      # Serienummer (tom = auto-detektert fraa instrumentet)
      - OPENDAQ_SERIAL=
      # Modellnamn som visest i DewesoftX (tom = "PQTech-openDAQ")
      - OPENDAQ_MODEL=PQTech-openDAQ
      # MAC-adresse (tom = auto-detect fraa nettverksgrensesnitt)
      #- OPENDAQ_MAC=
      # OPC-UA annonsert IP (tom = auto-detect fraa nettverksgrensesnitt)
      #- OPENDAQ_IP=

    deploy:
      resources:
        limits:
          memory: 1G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
